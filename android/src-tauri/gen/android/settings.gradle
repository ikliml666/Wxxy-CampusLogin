include ':app'

// 手写插件与官方 biometric 的 include 持久声明：
// tauri CLI 每次构建会重生成 tauri.settings.gradle(autogenerated),且其生成逻辑
// 会漏掉 path 依赖的手写插件与部分官方插件(2026-09-08 真机实锤
// ClassNotFoundException: NetworkBindPlugin → 密码保存/验证门/FGS/WiFi 绑定全挂)。
// 因此在这里声明,settings.gradle 本身不被 CLI 覆盖,可持久生效。
// 升级插件或 tauri 版本时需同步校对下方路径。
include ':tauri-plugin-campus-network-bind'
project(':tauri-plugin-campus-network-bind').projectDir = new File("../../../plugins/network-bind/android")
include ':tauri-plugin-campus-keystore'
project(':tauri-plugin-campus-keystore').projectDir = new File("../../../plugins/keystore/android")
include ':tauri-plugin-campus-monitor-service'
project(':tauri-plugin-campus-monitor-service').projectDir = new File("../../../plugins/foreground-service/android")
include ':tauri-plugin-biometric'
project(':tauri-plugin-biometric').projectDir = new File("C:/Users/ik/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/tauri-plugin-biometric-2.3.3/android")

include ':tauri-plugin-opener'
project(':tauri-plugin-opener').projectDir = new File("C:/Users/ik/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/tauri-plugin-opener-2.5.5/android")

apply from: 'tauri.settings.gradle'
