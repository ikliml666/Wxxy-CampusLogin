[default]
description = """
把 CampusLogin 进程网络绑定到 WLAN(ConnectivityManager.bindProcessToNetwork),
强制登录流量走 WiFi 而非移动数据。
"""

permissions = [
  "allow-bind-to-wifi",
  "allow-unbind",
  "allow-accept-wifi-network",
  "allow-ensure-avoid-bad-wifi",
  "allow-restore-avoid-bad-wifi",
  "allow-restore-written-settings",
  "allow-get-secure-settings-status",
]
