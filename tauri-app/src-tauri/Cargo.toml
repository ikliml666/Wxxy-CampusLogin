[package]
name = "campus-login"
version = "2.4.3"
# tauri CLI 需要知道默认主二进制（新增 campus-login-core 后必须显式指定）
default-run = "campus-login"
description = "校园网登录助手"
authors = ["you"]
edition = "2021"

[lib]
name = "campus_login_lib"
crate-type = ["cdylib", "rlib"]

# 无头登录核心：由 SYSTEM 计划任务在开机（未登录 Windows）时拉起，
# 复用 lib 的协议/探测/DPAPI 纯函数，不依赖 tauri 运行时
[[bin]]
name = "campus-login-core"
path = "src/bin/campus-login-core.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "charset", "cookies"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
dirs = "6"
lazy_static = "1.5"
base64 = "0.22"
regex = "1"
urlencoding = "2"
chrono = "0.4"
open = "5"
url = "2"
surge-ping = "0.8"
parking_lot = "0.12"
arc-swap = "1"
dashmap = "6"
getrandom = "0.3"
sha2 = "0.10"
md-5 = "0.10"

# WebVPN 网关协议（src/vpn/，移植自 Wxxy-CampusHub 2026-10-25）：
# AES-128-CFB128 host 加密 + URL 包装 + CAS 统一认证 + 会话/路由层。
# 全部纯 Rust，Windows/Android 双端可编译
aes = "0.8"
# CFB128（全块段）：流式模式无 padding，密文长度 = 明文长度
cfb-mode = "0.8"
hex = "0.4"
thiserror = "2"
# CAS 登录密码 textbook RSA（Shapiro RSA.js 系无 padding）
num-bigint-dig = "0.8"
# kaptcha 算术验证码 PNG 解码（识别器 src/vpn/captcha.rs，模板 templates/）
image = { version = "0.25", default-features = false, features = ["png"] }
num-traits = "0.2"

# 安卓 SO_BINDTODEVICE 物理网卡旁路(bound_socket.rs;cfg(target_os = "android") 门控,桌面不编译)。
# socket2/hyper/http-body-util 均已在依赖树内(reqwest→hyper-util/hyper),此处仅补安卓目标直连
# 声明,不新增编译产物;network-interface 与安卓壳工程(android/src-tauri)同版本。
[target.'cfg(target_os = "android")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
# EINPROGRESS 判定用(非阻塞 connect 的 std ErrorKind 映射缺口,真机实证)
libc = "0.2"
network-interface = "2"

# 桌面专属插件:不参与安卓/iOS 构建(官方 updater 插件 README 同款写法)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
webview2-com = "0.39"
webview2-com-sys = "0.39"
windows-core = "0.62"
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Security_Credentials_UI",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
    "Win32_System_WinRT",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
# 审计 A1：不使用 panic="abort"——panic 改为展开（unwind），工作线程 panic 不再
# 直接终止整个进程，第三方 panic 降级为单任务失败；体积代价可接受。
