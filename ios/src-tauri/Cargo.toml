[package]
name = "campus-login-ios"
version = "2.4.0"
description = "校园网登录助手 iOS 端"
edition = "2021"

[lib]
name = "campus_login_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
# 钉与桌面 lock 同源基线(tauri 2.11.0/wry 0.55.1):tauri 2.12+ 的 wry 拉 webview2-com 0.39,
# 与协议核心直接依赖的 0.38 撞双版本致 E0599(specs/ios-port-spec.md 同构策略,iOS 升级节奏跟随桌面)
tauri = { version = "=2.11.0", features = ["protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 协议核心:与桌面端/安卓端单点共享(specs/ios-port-spec.md §1)
campus-login = { path = "../../tauri-app/src-tauri" }
# 官方插件:生物识别验证门(Face ID)与外链打开;iOS 专属插件按 spec §6 在 M1 增补
tauri-plugin-biometric = "2"
tauri-plugin-opener = "2"
# 统一化锚点:与桌面 lock 基线对齐,防止 caret 漂移拉入 API 不兼容的 runtime 版本
# (tauri 2.11.0 配 tauri-runtime-wry 2.12.x 会因 primary_monitor 签名变更编译失败)
tauri-macros = "=2.6.0"
tauri-utils = "=2.9.0"
tauri-runtime-wry = "=2.11.0"
tauri-runtime = "=2.11.0"
tao = "=0.35.2"
muda = "=0.19.1"

# 本 crate 是 iOS 构建的 workspace 根(同安卓:release 档必须在此声明才作用于全量依赖)
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
