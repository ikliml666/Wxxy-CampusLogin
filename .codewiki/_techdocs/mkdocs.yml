site_name: Wxxy-CampusLogin
site_description: Wxxy-CampusLogin 是武汉学院校园网自动登录客户端，基于 Tauri 2.0 框架同时支持 桌面端（Windows/macOS/Linux）与 Android 移动端。项目通过内置的认证协议实现校园网 Portal 自动登录、断线重连、网速监控、账号管理与 VPN 集成，避免学生每次连接校园…
